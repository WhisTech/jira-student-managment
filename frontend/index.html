<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Student Management</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="hero">
    <span class="badge">Jira College Project</span>
    <h1>Student Management System</h1>
    <p>Manage students, track departments and attendance all in one place, powered by Supabase.</p>
  </div>

  <div class="panel">
    <h2 id="formTitle">Welcome Back</h2>
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none;">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Jane Doe">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="primary" id="submitBtn">Login</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="foot">Powered by FastAPI + Supabase</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
